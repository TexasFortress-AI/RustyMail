# cargo-deny configuration for RustyMail
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
# Licenses used by RustyMail itself (MPL-2.0) and its Rust dependency graph.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

# Exceptions for crates with unusual but acceptable licensing.
exceptions = [
    # ring historically used a custom ISC-style notice; newer versions are dual-licensed.
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "ring" },
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "webpki" },
    { allow = ["ISC", "MIT", "OpenSSL"], crate = "rustls-webpki" },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[advisories]
version = 2
yanked = "warn"
# Ignore only when an upgrade is not yet available or would be a large breaking
# change; prefer upgrading dependencies. Entries must include a rationale.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
