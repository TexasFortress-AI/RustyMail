# End-to-End Test Workflow for RustyMail
# Runs comprehensive E2E tests including MCP protocol, dashboard UI, and complete workflows

name: End-to-End Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Test environment configuration
  MCP_BACKEND_URL: http://localhost:9437/mcp
  MCP_TIMEOUT: 30

jobs:
  e2e-tests:
    name: Complete E2E Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/rustymail-app-main/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend/rustymail-app-main
        run: npm ci

      - name: Build Rust binaries
        run: |
          cargo build --release --bin rustymail-server
          cargo build --release --bin rustymail-mcp-stdio

      - name: Run unit tests
        run: cargo test --lib --bins

      - name: Run integration tests
        run: cargo test --test '*' -- --test-threads=1

      - name: Start backend server
        env:
          REST_HOST: 127.0.0.1
          REST_PORT: "9437"
          SSE_HOST: 127.0.0.1
          SSE_PORT: "9438"
          DASHBOARD_HOST: 127.0.0.1
          DASHBOARD_PORT: "9439"
          IMAP_HOST: localhost
          IMAP_PORT: "993"
          IMAP_USER: e2e@example.com
          IMAP_PASS: e2e-test-password
          RUSTYMAIL_API_KEY: e2e-test-api-key-not-a-secret
          RUST_LOG: info
        run: |
          # Create dirs and seed a default account (accounts.json is gitignored).
          # Server panics on startup without a default account in accounts.json.
          mkdir -p .rustymail data config
          cp config/accounts.json.example config/accounts.json

          # Start server in background
          ./target/release/rustymail-server > backend.log 2>&1 &
          echo $! > backend.pid

          # Wait for server to be ready
          for i in {1..30}; do
            if curl -s http://localhost:9437/api/dashboard/status > /dev/null; then
              echo "Backend server ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done

          # Verify server is running
          if ! curl -s http://localhost:9437/api/dashboard/status > /dev/null; then
            echo "Backend server failed to start"
            cat backend.log
            exit 1
          fi

      - name: Start frontend server
        env:
          # vite.config.ts requires these; UI tests hit the Vite port below.
          DASHBOARD_HOST: 127.0.0.1
          DASHBOARD_PORT: "5173"
          REST_PORT: "9437"
        run: |
          cd frontend/rustymail-app-main
          npm run dev > ../../frontend.log 2>&1 &
          echo $! > ../../frontend.pid
          cd ../..

          # Wait for frontend to be ready
          for i in {1..30}; do
            if curl -s http://localhost:5173 > /dev/null; then
              echo "Frontend server ready"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 1
          done

          # Verify frontend is running
          if ! curl -s http://localhost:5173 > /dev/null; then
            echo "Frontend server failed to start"
            cat frontend.log
            exit 1
          fi

      - name: Run MCP client tests
        # Prefer a bounded HTTP JSON-RPC smoke against /mcp. The Python stdio
        # client has hung 15+ minutes in CI (handshake never completes).
        timeout-minutes: 5
        env:
          RUSTYMAIL_API_KEY: e2e-test-api-key-not-a-secret
        run: |
          set -euo pipefail
          echo "MCP HTTP smoke: initialize"
          init_resp=$(curl -sf -X POST "http://127.0.0.1:9437/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "X-API-Key: ${RUSTYMAIL_API_KEY}" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-e2e","version":"0.0.1"}}}')
          echo "$init_resp" | tee /tmp/mcp-init.json
          echo "$init_resp" | grep -q '"result"'

          echo "MCP HTTP smoke: tools/list"
          tools_resp=$(curl -sf -X POST "http://127.0.0.1:9437/mcp" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "X-API-Key: ${RUSTYMAIL_API_KEY}" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "$tools_resp" | tee /tmp/mcp-tools.json
          echo "$tools_resp" | grep -q '"tools"'

          echo "MCP HTTP smoke passed"

      - name: Run E2E workflow tests
        run: |
          source .venv/bin/activate
          # Note: UI tests would require headless browser setup
          # For now, run what's available
          if [ -f "scripts/test_ui_workflows.py" ]; then
            python scripts/test_ui_workflows.py --url http://localhost:5173
          else
            echo "UI workflow tests not yet implemented (skipping)"
          fi

      - name: Collect test artifacts
        if: always()
        run: |
          mkdir -p test-artifacts
          cp backend.log test-artifacts/ || true
          cp frontend.log test-artifacts/ || true
          cp -r test-results test-artifacts/ || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-artifacts
          path: test-artifacts/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          # Stop backend
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

          # Stop frontend
          if [ -f frontend.pid ]; then
            kill $(cat frontend.pid) || true
          fi

          # Cleanup
          sleep 2

      - name: Generate test report
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Status: $(curl -s http://localhost:9437/api/dashboard/status > /dev/null && echo '✅ Online' || echo '❌ Offline')" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Status: $(curl -s http://localhost:5173 > /dev/null && echo '✅ Online' || echo '❌ Offline')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f test-results/workflow-report.json ]; then
            echo "### Workflow Test Results" >> $GITHUB_STEP_SUMMARY
            cat test-results/workflow-report.json >> $GITHUB_STEP_SUMMARY
          fi
